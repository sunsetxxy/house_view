<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房源聚类分析结果</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">房源聚类分析结果</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card chart-container">
                    <div class="card-header">
                        <h5>聚类散点图</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="scatterChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card chart-container">
                    <div class="card-header">
                        <h5>聚类样本数量</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card chart-container">
                    <div class="card-header">
                        <h5>聚类特征雷达图</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5>聚类数据表格</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="dataTable">
                        <thead>
                            <tr>
                                <th>聚类ID</th>
                                <th>样本数量</th>
                                <th>平均价格</th>
                                <th>平均面积</th>
                                <th>代表房源</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 数据将通过JavaScript动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 从API获取数据并渲染图表
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/house/cluster-analysis/')
                .then(response => {
                    console.log('API响应状态:', response.status);
                    if (!response.ok) {
                        throw new Error(`HTTP错误! 状态码: ${response.status}`);
                    }
                    return response.json();
                })
                .then(clusterData => {
                    console.log('API返回数据:', clusterData);
                    
                    if (!clusterData.visualization) {
                        throw new Error('API返回数据缺少visualization字段');
                    }
                    
                    // 渲染散点图
                    renderScatterChart(clusterData.visualization);
                    
                    // 渲染柱状图
                    renderBarChart(clusterData.clusters);
                    
                    // 渲染雷达图
                    renderRadarChart(clusterData.clusters, clusterData.features);
                    
                    // 填充表格数据
                    populateTable(clusterData.clusters);
                })
                .catch(error => {
                    console.error('获取聚类数据失败:', error);
                    alert('获取聚类数据失败: ' + error.message);
                });


        });

        function renderScatterChart(data) {
            const ctx = document.getElementById('scatterChart').getContext('2d');
            
            if (!Array.isArray(data)) {
                console.error('renderScatterChart: 数据格式错误，期望数组但得到', typeof data);
                return;
            }
            
            // 按聚类ID分组数据
            const clusters = {};
            data.forEach(item => {
                if (!item || typeof item !== 'object') {
                    console.warn('renderScatterChart: 忽略无效数据项', item);
                    return;
                }
                
                if (!clusters[item.cluster_id]) {
                    clusters[item.cluster_id] = {
                        label: `聚类 ${item.cluster_id}`,
                        data: [],
                        backgroundColor: getRandomColor()
                    };
                }
                
                if (typeof item.x === 'number' && typeof item.y === 'number') {
                    clusters[item.cluster_id].data.push({
                        x: item.x,
                        y: item.y
                    });
                } else {
                    console.warn('renderScatterChart: 忽略无效坐标数据', item);
                }
            });
            
            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: Object.values(clusters)
                },
                options: {
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: '特征X'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '特征Y'
                            }
                        }
                    }
                }
            });
        }

        function renderBarChart(clusters) {
            const ctx = document.getElementById('barChart').getContext('2d');
            
            const labels = clusters.map(c => `聚类 ${c.id}`);
            const data = clusters.map(c => c.count);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '样本数量',
                        data: data,
                        backgroundColor: clusters.map(() => getRandomColor())
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '样本数量'
                            }
                        }
                    }
                }
            });
        }
        
        function renderRadarChart(clusters, features) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            // 预定义一组对比鲜明的颜色
            const predefinedColors = [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)',
                'rgba(75, 192, 192, 0.2)',
                'rgba(153, 102, 255, 0.2)'
            ];
            const borderColors = [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)',
                'rgba(153, 102, 255, 1)'
            ];
            
            const datasets = clusters.map((cluster, index) => ({
                label: `聚类 ${cluster.id}`,
                data: features.map(f => cluster[f]),
                backgroundColor: predefinedColors[index % predefinedColors.length],
                borderColor: borderColors[index % borderColors.length],
                borderWidth: 1
            }));
            
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: features,
                    datasets: datasets
                },
                options: {
                    scales: {
                        r: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        function populateTable(clusters) {
            const tableBody = document.querySelector('#dataTable tbody');
            tableBody.innerHTML = '';
            
            clusters.forEach(cluster => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${cluster.id}</td>
                    <td>${cluster.count}</td>
                    <td>${cluster.avg_price}</td>
                    <td>${cluster.avg_area}</td>
                    <td>${cluster.representative_house}</td>
                `;
                tableBody.appendChild(row);
            });
        }
        
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
    </script>
</body>
</html>
